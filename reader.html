<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snippet Reader 0.88</title>
<link rel="stylesheet" href="player/player.css?v=0.88">
</head>
<body class="reader player">
<div class="app">
  <div class="apptitle">Snippet Reader</div>

  <div class="layout">
    <div class="leftcol">
      <div class="sidebarSection readerSnippetSection">
        <div class="sectionLabel">Snippet</div>
        <select id="readerSnippetSelect" class="sel readerSnippetSelect"></select>
        <div id="readerStatus" class="readerStatus"></div>
      </div>

      <div class="playbar playerOnly">
        <button id="playBtn" class="action">Play</button>
        <button id="stopBtn" class="action">Stop</button>
      </div>
      <div class="progress playerOnly"><div id="progressFill" class="progressFill"></div></div>

      <div class="playerClipControls">
        <div class="sidebarSeparator"></div>
        <div class="sectionLabel">Snippet</div>

        <div class="clipKeyWrap">
          <button id="playerKeyBtn" class="clipKeyBtn" type="button">Key: C/Am</button>
          <div id="playerKeyMenu" class="clipKeyMenu"></div>
        </div>
        <button id="playerLabelBtn" class="labelModeBtn" type="button">Labels: Interval</button>
        <div id="clipVariantTag" class="clipVariantTag">Original position</div>
      </div>
    </div>

    <div class="maincol">
      <div class="wrap">
        <div id="shell" class="shell">
          <div id="openrow" class="openrow"></div>
          <div class="nut"></div>
          <div id="board" class="board"></div>
          <svg id="moveSvg" class="movementSvg"></svg>
          <div id="fingerLayer">
            <div id="fingerRect0" class="fingerRect" data-finger-choice="I"></div>
            <div id="fingerRect1" class="fingerRect" data-finger-choice="M"></div>
            <div id="fingerRect2" class="fingerRect" data-finger-choice="R"></div>
            <div id="fingerRect3" class="fingerRect" data-finger-choice="P"></div>
          </div>
          <div id="fingerAssignMark"></div>
          <div id="fingerAssignDestinationMark"></div>
          <div id="fingerAssignPopup" aria-hidden="true">
            <div id="fingerAssignMovement"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!--
  Hidden runtime support: player-core.js is intentionally the exact same
  runtime used by Lesson Builder. These nodes satisfy authoring-only hooks
  without putting any authoring controls into the Reader interface.
-->
<div class="readerRuntimeSupport" aria-hidden="true">
  <button id="adminTab" type="button"></button>
  <button id="playerTab" type="button"></button>
  <select id="keySel"></select>
  <button id="adminLabelBtn" type="button"></button>
  <div id="status"></div>
  <div class="sequenceWrap"><div id="eventPanel"></div></div>
  <button id="authorModeBtn" type="button"></button>
  <div id="movementSeparator"></div>
  <div id="movementSection"></div>
  <button id="chordBtn" type="button"></button>
  <button id="scoreToggleBtn" type="button"></button>
  <button id="undoBtn" type="button"></button>
  <button id="clearBtn" type="button"></button>
  <button id="createOpenBtn" type="button"></button>
  <button id="approveClipBtn" type="button"></button>
  <button id="recallClipBtn" type="button"></button>

  <div id="scoreSection" hidden aria-hidden="true">
    <div id="scorePopupCard">
      <div id="scoreToolbar"></div>
      <div id="scoreViewport"><svg id="scoreSvg"></svg></div>
      <div id="durationEditor">
        <button id="durationMinus" type="button"></button>
        <button id="durationValue" type="button"></button>
        <button id="durationPlus" type="button"></button>
      </div>
      <button id="restBtn" type="button"></button>
      <button id="scoreCloseBtn" type="button"></button>
    </div>
  </div>

  <div id="clipDialog" aria-hidden="true">
    <div id="clipDialogTitle"></div>
    <div id="clipDialogText"></div>
    <button id="clipDialogCancel" type="button"></button>
    <button id="clipDialogPrimary" type="button"></button>
  </div>

  <div id="fingeringConfirmDialog" aria-hidden="true">
    <button id="fingeringConfirmEdit" type="button"></button>
    <button id="fingeringConfirmContinue" type="button"></button>
  </div>
</div>

<script src="player/player-core.js?v=0.88"></script>
<script src="player/reader.js?v=0.88"></script>
</body>
</html>
